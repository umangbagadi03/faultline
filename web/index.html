<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faultline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M9 22 L14 12 L18 18 L23 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="logo">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 22 L14 12 L18 18 L23 9" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>
          <strong>Faultline</strong>
          <small>Agent failure forensics</small>
        </span>
      </a>
      <div class="nav-label">Workspace</div>
      <nav class="nav">
        <a href="#/" data-nav="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Overview</a>
        <a href="#/traces" data-nav="traces">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          Traces</a>
        <a href="#/eval" data-nav="eval">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
          Evaluation</a>
        <a href="#/integrations" data-nav="integrations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7zM12 16v5"/></svg>
          Integrations</a>
      </nav>
      <div class="sidebar-foot">
        <div id="mode-badge" class="mode-badge">…</div>
        <button id="theme-toggle" class="btn ghost small" type="button">Toggle theme</button>
      </div>
    </aside>
    <main class="main">
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
